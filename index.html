<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">

    <div id="app-container" class="max-w-2xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-slate-800">✅ Collaborative To-Do List</h1>
            <div id="auth-container">
                <button id="login-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105">
                    Login with Google
                </button>
                <div id="user-info" class="hidden items-center gap-3">
                    <img id="user-pic" class="w-10 h-10 rounded-full" alt="User profile picture">
                    <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105">
                        Logout
                    </button>
                </div>
            </div>
        </div>

        <form id="add-todo-form" class="hidden mb-6 p-4 bg-white rounded-lg shadow-md">
            <h2 class="text-xl font-semibold text-slate-700 mb-3">Add a New Task</h2>
            <div class="flex gap-5">
                <input type="text" id="todo-input" placeholder="What needs to be done?" class="flex-grow p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-5 rounded-lg shadow-md transition-transform transform hover:scale-105">Add</button>
            </div>
        </form>

        <div id="todo-list-container" class="bg-white rounded-lg shadow-md p-4">
             <p id="login-prompt" class="text-center text-slate-500 p-8">Please log in to see and add tasks.</p>
            <ul id="todo-list">
                </ul>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script src="app.js"></script>

</body>
</html>
